name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 允許在 Actions 頁面手動觸發

# GitHub Pages 部署所需權限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時間只跑一個部署，新的 push 會取代排隊中的舊部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend # 所有 run step 都在 frontend/ 執行
    env:
      # 這兩個值非機密（anon key 設計上就是公開、會出現在前端 bundle），
      # 直接寫在 workflow 當一般環境變數即可，不需放 GitHub Secrets。
      # 真正的機密（SUPABASE_SERVICE_ROLE_KEY、SHARED_PASSWORD_HASH/SALT）
      # 只存在 Edge Function 的環境變數，從不進前端也不進這個 workflow。
      VITE_SUPABASE_URL: https://bxdbacgakdrhbuqbbmmn.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_pM-W16CrDbjcbI2xDr9hOA_ku6dg4ok
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist # 相對於 repo 根目錄

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
